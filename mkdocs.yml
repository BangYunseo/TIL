site_name: BangYunseo
site_description: 개발·컴퓨터공학 학습 기록
docs_dir: .
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

hooks:
  - hooks/recent_posts.py

plugins:
  - search
  - same-dir
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BangYunseo
      name: GitHub
    # 아래 주석을 풀고 실제 메일 주소를 넣으면 메일 아이콘이 생깁니다.
    # - icon: fontawesome/solid/envelope
    #   link: mailto:주소@도메인
    #   name: Mail

extra_css:
  - stylesheets/post-list.css

extra_javascript:
  - javascripts/blog.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  **/Image/**/*.md
  hooks/
  venv/
  .venv/
  site/
  requirements.txt
  /README.md
