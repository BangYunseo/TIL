#  The contact options.

- type: github
  icon: "fab fa-github"

- type: twitter
  icon: "fa-brands fa-x-twitter"

- type: email
  icon: "fas fa-envelope"
  noblank: true # open link in current tab

# 포트폴리오 블로그로 이동. 같은 도메인이라 같은 탭에서 연다.
- type: portfolio
  icon: "fas fa-address-card"
  url: "https://bangyunseo.github.io/"
  noblank: true

